name: Agregar .ipa con versión a versiones anteriores (una vez)

on:
  push:
    branches: [main]
    paths: [".github/workflows/rename-assets.yml"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar T-Box.ipa como T-Box-X.Y.Z.ipa
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          for tag in v0.1.0 v0.1.1 v0.2.0 v0.2.1; do
            ver="${tag#v}"
            mkdir -p "$tag"
            gh release download "$tag" -R "$R" -p T-Box.ipa -D "$tag"
            mv "$tag/T-Box.ipa" "$tag/T-Box-$ver.ipa"
            gh release upload "$tag" "$tag/T-Box-$ver.ipa" -R "$R" --clobber
          done
