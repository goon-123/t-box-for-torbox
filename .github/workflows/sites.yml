name: Actualizar sitios compatibles

on:
  schedule:
    - cron: "17 9 * * 1"   # lunes, 06:17 en Chile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate docs/SITES.md
        run: python3 tools/gen_sites.py docs/SITES.md
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/SITES.md; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: update supported sites"
          git push
