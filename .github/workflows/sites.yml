name: Actualizar sitios compatibles

on:
  schedule:
    - cron: "17 9 * * 1"   # lunes, 06:17 en Chile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar docs/SITIOS.md
        run: python3 tools/gen_sites.py docs/SITIOS.md
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- docs/SITIOS.md; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: actualizar sitios compatibles"
          git push
