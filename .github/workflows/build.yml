name: Build

on:
  push:
    branches: [main]
    # Docs-only changes don't need a build.
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", ".github/FUNDING.yml", "tools/**", ".github/workflows/sites.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Promote the current version from pre-release to stable (no build)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.publish }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Generar proyecto
        run: xcodegen generate

      - name: Pruebas (simulador)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'] if c else '')")
          echo "Simulador: $UDID"
          set -o pipefail
          xcodebuild test -project TBox.xcodeproj -scheme TBox \
            -destination "id=$UDID" -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Compilar para iPhone (sin firma)
        run: |
          set -o pipefail
          xcodebuild -project TBox.xcodeproj -scheme TBox -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/TBox.app

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TBox.app Payload/
          zip -qry T-Box.ipa Payload
          VER=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"(.*)".*/\1/')
          cp T-Box.ipa "T-Box-$VER.ipa"
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: T-Box-ipa
          path: T-Box-*.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

      - name: Publish pre-release (every push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"(.*)".*/\1/')
          TAG="v$VER"
          # Notas: la sección de esta versión en CHANGELOG.md
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[[0-9]/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\nBuild %s · %s\n\nSign it with your own certificate (Feather, ESign, SideStore…) before installing. / Fírmala con tu propio certificado antes de instalar.\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Misma versión, nueva compilación: se reemplaza el .ipa y se actualizan las notas.
            gh release upload "$TAG" "T-Box-$VER.ipa" T-Box.ipa --clobber
            gh release edit "$TAG" --notes-file notes.md --title "T-Box $VER"
          else
            gh release create "$TAG" "T-Box-$VER.ipa" T-Box.ipa --target "$GITHUB_SHA" --title "T-Box $VER" --notes-file notes.md --prerelease
          fi
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote to stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"(.*)".*/\1/')
          gh release edit "v$VER" --prerelease=false --latest
      - name: Update Feather/AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"(.*)".*/\1/')
          SIZE=$(gh release view "v$VER" --json assets --jq ".assets[] | select(.name==\"T-Box-$VER.ipa\") | .size")
          BUILD=$(gh release view "v$VER" --json body --jq '.body' | sed -nE 's/^Build ([0-9]+).*/\1/p' | head -1)
          python3 tools/update_source.py "$VER" "${BUILD:-0}" "$(date -u +%F)" "$SIZE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source.json
          git diff --cached --quiet || { git commit -m "Source: T-Box $VER"; git push; }
