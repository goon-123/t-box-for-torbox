name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Generar proyecto
        run: xcodegen generate

      - name: Pruebas (simulador)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'] if c else '')")
          echo "Simulador: $UDID"
          set -o pipefail
          xcodebuild test -project TBox.xcodeproj -scheme TBox \
            -destination "id=$UDID" -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Compilar para iPhone (sin firma)
        run: |
          set -o pipefail
          xcodebuild -project TBox.xcodeproj -scheme TBox -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/TBox.app

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TBox.app Payload/
          zip -qry T-Box.ipa Payload
          ls -lh T-Box.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: T-Box-ipa
          path: T-Box.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

      - name: Publicar release (al etiquetar vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" T-Box.ipa --title "T-Box $GITHUB_REF_NAME" --generate-notes
