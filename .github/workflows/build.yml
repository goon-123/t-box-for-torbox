name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Generar proyecto
        run: xcodegen generate

      - name: Pruebas (simulador)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'] if c else '')")
          echo "Simulador: $UDID"
          set -o pipefail
          xcodebuild test -project TBox.xcodeproj -scheme TBox \
            -destination "id=$UDID" -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Compilar para iPhone (sin firma)
        run: |
          set -o pipefail
          xcodebuild -project TBox.xcodeproj -scheme TBox -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/TBox.app

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TBox.app Payload/
          zip -qry T-Box.ipa Payload
          VER=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"(.*)".*/\1/')
          cp T-Box.ipa "T-Box-$VER.ipa"
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: T-Box-ipa
          path: T-Box-*.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

      - name: Publicar versión (cada push a main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*"(.*)".*/\1/')
          TAG="v$VER"
          # Notas: la sección de esta versión en CHANGELOG.md
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[[0-9]/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\nBuild %s · %s\n\nFírmala con tu propio certificado (Feather, ESign, SideStore…) antes de instalar.\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Misma versión, nueva compilación: se reemplaza el .ipa y se actualizan las notas.
            gh release upload "$TAG" "T-Box-$VER.ipa" T-Box.ipa --clobber
            gh release edit "$TAG" --notes-file notes.md --title "T-Box $VER"
          else
            gh release create "$TAG" "T-Box-$VER.ipa" T-Box.ipa --target "$GITHUB_SHA" --title "T-Box $VER" --notes-file notes.md --latest
          fi
          # La antigua publicación móvil "latest" ya no se usa.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
