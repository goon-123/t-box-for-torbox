name: Publicar versiones anteriores (una vez)

on:
  push:
    branches: [main]
    paths: [".github/workflows/backfill-releases.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear v0.1.0 y v0.1.1 con sus .ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            VER=$1; RUN=$2; SHA=$3; BUILD=$4
            if gh release view "v$VER" >/dev/null 2>&1; then echo "v$VER ya existe"; return; fi
            mkdir -p "dl-$VER"
            gh run download "$RUN" -n T-Box-ipa -D "dl-$VER"
            awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[[0-9]/ {f=0} f' CHANGELOG.md > "notes-$VER.md"
            printf '\n---\nBuild %s · %s\n\nFírmala con tu propio certificado antes de instalar.\n' "$BUILD" "${SHA::7}" >> "notes-$VER.md"
            gh release create "v$VER" "dl-$VER/T-Box.ipa" --target "$SHA" --title "T-Box $VER" \
              --notes-file "notes-$VER.md" --latest=false
          }
          publish 0.1.0 43718347752 f22dc0f3cafdcd99fc36eddf5d3a81a4fad57794 2
          publish 0.1.1 43720497301 14ac8011b3d7452f8b6770c60f209240f2518314 4
